<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Frontend Mentor | Product preview card component</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="mainer">
      <img
        src="images/image-product-desktop.jpg"
        alt="product image"
        class="will"
      />
      <img src="images/image-product-mobile.jpg" alt="mobile" class="mobil" />

      <div class="none">
        <h2 class="cold">PERFUME</h2>
        <p class="s1">
          Gabrielle Essence<br />
          Eau De Parfum
        </p>
        <p class="s2">
          A floral, Solar and voluptuous <br />
          interpretation composed by <br />
          Olivier Polge, Perfumer-Creator <br />for the House of CHANEL.
        </p>
        <p class="s3">$149.99 <strike>$169.99</strike></p>
        <button>
          <img src="images/icon-cart.svg" alt="cart" />Add to Cart
        </button>
      </div>
    </div>
  </body>
</html>
